<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <style>
    .title { fill: #2f80ed; font-size: 20px; font-weight: 700; }
    .label { fill: #c9c9c9; font-size: 14px; }
    .value { fill: #2f80ed; font-size: 14px; font-weight: 600; }
    .dots  { fill: #999; font-size: 14px; }
    .bg    { fill: #1e2327; stroke: #3a3f44; stroke-width: 1; rx: 10; ry: 10; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="479" height="219"/>

  <text x="25" y="35" class="title">Manjunadh418's GitHub Stats</text>
  <text x="25" y="55" class="label" id="age_data">-</text>

  <text x="25" y="90" class="label">Total Commits (past year):</text>
  <text x="300" y="90" class="dots" id="commit_data_dots"></text>
  <text x="440" y="90" class="value" id="commit_data" text-anchor="end">0</text>

  <text x="25" y="115" class="label">Repositories:</text>
  <text x="300" y="115" class="dots" id="repo_data_dots"></text>
  <text x="440" y="115" class="value" id="repo_data" text-anchor="end">0</text>

  <text x="25" y="140" class="label">Stars Earned:</text>
  <text x="300" y="140" class="dots" id="star_data_dots"></text>
  <text x="440" y="140" class="value" id="star_data" text-anchor="end">0</text>

  <text x="25" y="165" class="label">Followers:</text>
  <text x="300" y="165" class="dots" id="follower_data_dots"></text>
  <text x="440" y="165" class="value" id="follower_data" text-anchor="end">0</text>

  <text x="25" y="195" class="label">Lines of Code (net):</text>
  <text x="440" y="195" class="value" text-anchor="end">
    <tspan id="loc_data">0</tspan>
    <tspan class="dots"> (+</tspan><tspan id="loc_add" class="value">0</tspan><tspan class="dots">, -</tspan><tspan id="loc_del" class="value">0</tspan><tspan class="dots">)</tspan>
  </text>
</svg>
